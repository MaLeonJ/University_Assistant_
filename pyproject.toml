[project]
name = "asistente-universitario"
version = "0.3.0"
description = "Bot de Telegram que investiga temarios en la web y genera documentos Markdown sincronizados a Obsidian."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot==22.8",
    "ddgs==9.15.0",
    "google-genai==2.19.0",
    "openai==3.3.1",
    "python-dotenv==1.2.3",
    "typer==0.27.1",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client==2.199.0",
    "google-auth-oauthlib==1.4.1",
    "google-auth-httplib2==0.4.2",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "asistente-universitario[drive]",
]

[project.scripts]
asistente = "asistente.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asistente"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # modernización de sintaxis
    "B",   # bugbear (bugs comunes)
    "SIM", # simplificaciones
    "C4",  # comprehensions
    "RUF", # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
# Los prompts son prosa en español: no se pueden partir sin alterarlos.
"asistente/analyzer.py" = ["E501"]
"asistente/bot.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ddgs.*", "google.genai.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["asistente"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", 'if __name__ == "__main__":']
